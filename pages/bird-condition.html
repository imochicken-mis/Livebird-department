<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bird Condition Console</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body class="dashboard-page">

    <aside class="sidebar">

        <div class="sidebar-brand">
            <img src="../assets/Logo.png" alt="Logo">
            <h2>Live Bird Department</h2>
        </div>

        <div class="sidebar-divider"></div>

        <p class="sidebar-section-title">DATA INPUT</p>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="sidebar-link">
                Daily Catching & Sales
            </a>

            <a href="bird-condition.html" class="sidebar-link active">
                Bird Condition & Defect
            </a>

        </nav>

        <div class="sidebar-divider"></div>

        <p class="sidebar-section-title">REPORTS</p>

        <nav class="sidebar-nav">

            <a href="report.html" class="sidebar-link">
                Catching Summ. Report
            </a>

            <a href="bird-condition-report.html" class="sidebar-link">
                Bird Condition Report
            </a>

            <a href="catching-breakdown.html" class="sidebar-link">
                Catching Breakdown
            </a>

        </nav>

        <div class="sidebar-divider"></div>

        <p class="sidebar-section-title">SYSTEM</p>

        <nav class="sidebar-nav">

            <a href="settings.html" class="sidebar-link">
                Settings
            </a>

        </nav>

    </aside>


    <main class="dashboard-main">

        <header class="dashboard-header">

            <h1>Bird Condition & Defect Details</h1>

            <div class="header-user">

                <span id="loggedUser">
                    Logged in as:
                </span>

                <button id="logoutBtn" class="logout-btn">
                    Logout
                </button>

            </div>

        </header>


        <section class="form-card">

            <div class="form-card-title">
                <h2> </h2>
            </div>


            <form id="birdConditionForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="conditionDate">Date</label>

                        <input
                            type="date"
                            id="conditionDate"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="farmerName">
                            Farmer Name
                        </label>

                        <select id="farmerName" required>
                            <option value="">
                                Select Farmer
                            </option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="batchNo2">
                            Load No (Imo Plant)
                        </label>

                        <input
                            type="text"
                            id="batchNo2"
                            placeholder="Ex:- 1"
                        >
                    </div>

                </div>


                <div class="form-grid">

                    <div class="form-group">
                        <label for="lookupNob">NOB</label>

                        <input
                            type="text"
                            id="lookupNob"
                            value="-"
                            readonly
                            class="readonly-field"
                        >
                    </div>


                    <div class="form-group">
                        <label for="lookupWeight">Weight (KG)</label>

                        <input
                            type="text"
                            id="lookupWeight"
                            value="-"
                            readonly
                            class="readonly-field"
                        >
                    </div>


                    <div class="form-group">
                        <label for="lookupAvgWeight">Avg Weight (KG)</label>

                        <input
                            type="text"
                            id="lookupAvgWeight"
                            value="-"
                            readonly
                            class="readonly-field"
                        >
                    </div>

                </div>


                <div class="form-card-title" style="margin-top:10px;">
                    <h2>Rejection Details</h2>
                </div>


                <div class="rejection-boxes">

                    <div class="rejection-box rejection-box-1">

                        <div class="form-group">
                            <label for="reason1">Reason 1</label>

                            <select id="reason1">
                                <option value="">
                                    Select Reason
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="weight1">
                                Rejection Weight 1 (KG)
                            </label>

                            <input
                                type="number"
                                id="weight1"
                                value="0"
                                step="0.01"
                                min="0"
                            >
                        </div>

                    </div>


                    <div class="rejection-box rejection-box-2">

                        <div class="form-group">
                            <label for="reason2">Reason 2</label>

                            <select id="reason2">
                                <option value="">
                                    Select Reason
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="weight2">
                                Rejection Weight 2 (KG)
                            </label>

                            <input
                                type="number"
                                id="weight2"
                                value="0"
                                step="0.01"
                                min="0"
                            >
                        </div>

                    </div>


                    <div class="rejection-box rejection-box-3">

                        <div class="form-group">
                            <label for="reason3">Reason 3</label>

                            <select id="reason3">
                                <option value="">
                                    Select Reason
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="weight3">
                                Rejection Weight 3 (KG)
                            </label>

                            <input
                                type="number"
                                id="weight3"
                                value="0"
                                step="0.01"
                                min="0"
                            >
                        </div>

                    </div>

                </div>


                <div class="form-grid">

                    <div class="form-group">
                        <label for="totalRejectionWeight">
                            Total Rejection Weight (KG)
                        </label>

                        <input
                            type="text"
                            id="totalRejectionWeight"
                            value="0.00"
                            readonly
                            class="readonly-field"
                        >
                    </div>

                </div>


                <div id="saveMessage" class="save-message"></div>


                <div class="form-actions">
                    <button
                        type="submit"
                        id="saveBtn"
                        class="save-btn"
                    >
                        Save Record
                    </button>
                </div>

            </form>

        </section>

    </main>


    <!-- PREVIEW MODAL -->

    <div id="previewModal" class="modal">

        <div class="modal-card small-modal">

            <h2>Confirm Record Details</h2>

            <div id="previewContent"></div>

            <div style="
                display:flex;
                justify-content:flex-end;
                gap:10px;
                margin-top:22px;
            ">

                <button
                    id="cancelPreviewBtn"
                    class="cancel-btn"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="confirmSaveBtn"
                    class="save-btn"
                    type="button"
                >
                    Confirm & Save
                </button>

            </div>

        </div>

    </div>


    <script src="../js/api.js"></script>
    <script src="../js/bird-condition.js"></script>

</body>
</html>
